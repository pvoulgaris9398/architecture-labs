name: api-load-test-example

services:
  db-server:
    extends:
      file: ../../shared/compose/sqlserver/service.yaml
      service: sqlserver-base
    ports:
      - "1433:1433"

  api-service:
    build:
      context: ./csharp-api/.
      dockerfile: Dockerfile
    environment:
      ConnectionStrings__Master: "Server=db-server;Database=master;User Id=sa;Password=${MSSQL_SA_PASSWORD};Max Pool Size=150;TrustServerCertificate=True;"
      ConnectionStrings__LoadTest: "Server=db-server;Database=LoadTestDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};Max Pool Size=150;TrustServerCertificate=True;"
      DOTNET_Metrics_Microsoft_Data_SqlClient: "true"
      Diagnostics__LogSuccessfulRequests: ${LOG_SUCCESSFUL_REQUESTS:-false}
      Diagnostics__LogSlowRequests: ${LOG_SLOW_REQUESTS:-false}
      Diagnostics__SlowRequestThresholdMs: ${SLOW_REQUEST_THRESHOLD_MS:-500}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_EXPORTER_OTLP_PROTOCOL: ${OTEL_EXPORTER_OTLP_PROTOCOL:-http/protobuf}
    ports:
      - "${API_HOST_PORT:-18080}:8080"
    depends_on:
      db-server:
        condition: service_healthy

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.5.5}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-remote-write-receiver
    volumes:
      # Apparently this container expects the "prometheus.yml" not "yaml"
      - ./prometheus/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - api-service

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:13.1.1}
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    volumes:
      # Data source auto-configuration
      # Same for data source: "datasource.yml" not "yaml"
      - ./grafana/datasource.yaml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      # Dashboard loader configuration
      # Same for data source: "provider.yml" not "yaml"
      - ./grafana/provider.yaml:/etc/grafana/provisioning/dashboards/provider.yml:ro
      # The actual dashboard file schema
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  prometheus-data:
