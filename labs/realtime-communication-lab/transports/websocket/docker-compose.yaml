name: architecture-labs-realtime-websocket

networks:
  observability:
    external: true
    name: architecture-labs-observability

services:

  server:
    build:
      context: ./src/Server
    container_name: architecture-labs-realtime-websocket-server

    ports:
      - "5000:8080"

    networks:
      - observability

    environment:
      ASPNETCORE_ENVIRONMENT: Development
