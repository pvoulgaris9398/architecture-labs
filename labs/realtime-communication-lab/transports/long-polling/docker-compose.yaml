name: architecture-labs-realtime-long-polling
networks:
  observability:
    external: true
    name: architecture-labs-observability
services:
  server:
    build:
      context: ./src/Server
    container_name: architecture-labs-realtime-long-polling-server
    ports:
      - "5002:8080"
    networks: [observability]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
