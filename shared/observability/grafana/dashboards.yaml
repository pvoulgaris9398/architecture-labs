apiVersion: 1

providers:
  - name: API load test
    orgId: 1
    folder: API Load Test
    type: file
    disableDeletion: true
    updateIntervalSeconds: 10
    options:
      path: /var/lib/grafana/dashboards/api-load-test

  - name: Distributed app
    orgId: 1
    folder: Distributed App
    type: file
    disableDeletion: true
    updateIntervalSeconds: 10
    options:
      path: /var/lib/grafana/dashboards/distributed-app

  - name: Realtime communication
    orgId: 1
    folder: Realtime Communication
    type: file
    disableDeletion: true
    updateIntervalSeconds: 10
    options:
      path: /var/lib/grafana/dashboards/realtime-communication
