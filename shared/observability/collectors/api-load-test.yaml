extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 384
    spike_limit_mib: 96

  tail_sampling:
    decision_wait: 5s
    num_traces: 20000
    expected_new_traces_per_sec: 2500
    policies:
      - name: errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: http-errors
        type: numeric_attribute
        numeric_attribute:
          key: http.response.status_code
          min_value: 400
          max_value: 599
      - name: slow
        type: latency
        latency:
          threshold_ms: 500
      - name: health-sample
        type: and
        and:
          and_sub_policy:
            - name: health-route
              type: string_attribute
              string_attribute:
                key: http.route
                values: [/health]
            - name: health-probability
              type: probabilistic
              probabilistic:
                sampling_percentage: 1
      - name: ordinary-success-sample
        type: and
        and:
          and_sub_policy:
            - name: not-health-route
              type: string_attribute
              string_attribute:
                key: http.route
                values: [/health]
                invert_match: true
            - name: ordinary-probability
              type: probabilistic
              probabilistic:
                sampling_percentage: 10

  batch:
    timeout: 1s
    send_batch_size: 1024
    send_batch_max_size: 2048

exporters:
  debug:
    verbosity: basic
    sampling_initial: 5
    sampling_thereafter: 500
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 512
      block_on_overflow: false
  otlphttp/seq:
    endpoint: http://seq:5341/ingest/otlp
    sending_queue:
      enabled: true
      num_consumers: 2
      queue_size: 1024
      block_on_overflow: false
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 5m

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: info
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, tail_sampling, batch]
      exporters: [otlphttp/seq]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/seq]
