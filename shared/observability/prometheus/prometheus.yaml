global:
  scrape_interval: 5s

scrape_configs:
  - job_name: api-load-test
    static_configs:
      - targets: [api-service:8080]

  - job_name: api-load-test-collector
    static_configs:
      - targets: [api-load-test-collector:8888]

  - job_name: distributed-app-collector
    static_configs:
      - targets: [distributed-app-collector:8888]

  - job_name: distributed-app-metrics
    static_configs:
      - targets: [distributed-app-collector:8889]

  - job_name: realtime-websocket
    static_configs:
      - targets: [architecture-labs-realtime-websocket-server:8080]

  - job_name: windows-host-os
    static_configs:
      - targets: [host.docker.internal:9182]
